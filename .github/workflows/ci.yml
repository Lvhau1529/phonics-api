name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # đọc packageManager trong package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Deploy lên VPS sau khi check qua, chỉ khi push vào main. Bật bằng cách đặt ở repo Settings > Secrets and variables
  # > Actions: variable VPS_HOST (+ tuỳ chọn VPS_USER, VPS_PORT, VPS_APP_DIR) và secret VPS_SSH_KEY (private key).
  # Chưa đặt VPS_HOST thì job bị bỏ qua. Trên VPS: kéo origin/main → build lại ảnh → chạy lại API + Caddy.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      HOST: ${{ vars.VPS_HOST }}
      PORT: ${{ vars.VPS_PORT || '22' }}
      SSH_USER: ${{ vars.VPS_USER || 'root' }}
      APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/phonics-api' }}
    steps:
      - name: Cài SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
      - name: Deploy trên VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$SSH_USER@$HOST" APP_DIR="$APP_DIR" 'sh -s' <<'EOF'
          set -eu
          cd "$APP_DIR"
          git fetch --prune origin main
          git reset --hard origin/main
          docker compose up -d --build --remove-orphans
          docker image prune -f
          # Chờ API khởi động (migrate + start) tối đa ~150 giây
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then echo "API healthy"; exit 0; fi
            sleep 5
          done
          echo "API không healthy sau deploy" >&2
          docker compose logs --tail 100 api >&2
          exit 1
          EOF
