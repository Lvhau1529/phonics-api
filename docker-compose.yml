# Toàn bộ backend trên một VPS (ADR 0024): Postgres + API + Caddy (HTTPS tự động) + backup hằng ngày. Từ gốc repo:
#   cp .env.example .env.production          # biến của API: secret, admin, CORS… (DB / media / URL do compose đặt)
#   printf 'API_DOMAIN=api.example.vn\nPOSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
#   docker compose up -d --build              # build tại chỗ (hoặc: docker compose pull && docker compose up -d)
#   docker compose exec api node_modules/.bin/prisma db seed   # lần đầu: admin + catalog game
# Biến của compose (file .env cạnh file này): API_DOMAIN, POSTGRES_PASSWORD (chỉ [0-9a-zA-Z], nằm trong URL kết nối)
# bắt buộc; tuỳ chọn BACKUP_KEEP_DAYS (7), TAG (latest), GHCR_OWNER (chữ thường).
# Dữ liệu: volume `pgdata` (Postgres), `media` (ảnh / audio), thư mục ./backups (bản dump + nén media hằng ngày).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: phonics
      POSTGRES_USER: phonics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong file .env cạnh docker-compose.yml}
    volumes:
      # Ảnh postgres 18 đặt PGDATA trong /var/lib/postgresql/<major>/docker → gắn volume ở thư mục cha
      - pgdata:/var/lib/postgresql
    # Không mở cổng ra ngoài: chỉ api / backup trong mạng compose kết nối được (psql: docker compose exec db psql -U phonics)
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U phonics -d phonics']
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 128mb
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  api:
    image: ghcr.io/${GHCR_OWNER:-lvhau1529}/phonics-api:${TAG:-latest}
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.production
    # Ghi đè .env.production: DB / media / URL public suy ra từ biến của compose, không khai báo hai nơi
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://phonics:${POSTGRES_PASSWORD}@db:5432/phonics
      DIRECT_URL: postgresql://phonics:${POSTGRES_PASSWORD}@db:5432/phonics
      API_PUBLIC_URL: https://${API_DOMAIN:?Thiếu API_DOMAIN trong file .env cạnh docker-compose.yml (vd api.example.vn)}
      MEDIA_DIR: /data/media
    volumes:
      - media:/data/media
    ports:
      # Chỉ loopback (curl kiểm tra từ host); bên ngoài đi qua Caddy → api:3000 trong mạng compose
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
    environment:
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Chứng chỉ TLS: giữ qua các lần tạo lại container (tránh xin lại, dính rate limit Let's Encrypt)
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # Backup: chạy ngay khi container khởi động rồi mỗi 24 giờ — pg_dump + nén thư mục media vào ./backups,
  # xoá bản cũ hơn BACKUP_KEEP_DAYS ngày. Nên chép ./backups ra ngoài VPS định kỳ (rsync / rclone).
  backup:
    image: postgres:18-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: phonics
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: phonics
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - media:/data/media:ro
    entrypoint: ['/bin/sh', '/backup.sh']
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '1m'
        max-file: '3'

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
